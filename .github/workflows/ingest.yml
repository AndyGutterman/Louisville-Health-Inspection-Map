name: Ingest ArcGIS -> Supabase
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 8 * * *"
concurrency: ingest
jobs:
  run:
    runs-on: ubuntu-latest
    # actions: write lets the last step re-enable the schedules (see below).
    permissions:
      contents: read
      actions: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        working-directory: .
        run: npm ci -w pipeline

      - name: Test
        run: npm test

      - name: Recover failed runs
        run: node Recover.js

      - name: Seed facilities
        run: node seed_facilities.js

      - name: Overlay geometry — pass 1
        run: node overlay_geometry.js

      - name: Seed inspections
        run: node seed_inspections.js

      - name: Overlay geometry — pass 2
        run: node overlay_geometry.js

      - name: Backfill facility types
        run: node backfill_types.js

      - name: Geocode missing geometry
        run: node geocode_missing.js

      - name: Seed violations
        run: node seed_violations.js

      - name: Seed categories
        run: node seed_categories.js

      # GitHub switches a public repo's scheduled workflows off after 60 days without
      # commits, silently; a week later Supabase's free plan would pause the project for
      # inactivity. Enabling a workflow is a no-op while it is on and counts as activity
      # on it (GitHub's own API, no third-party action). Runs even when a step above failed.
      - name: Keep the scheduled workflows enabled
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in ingest.yml bullitt-ingest.yml db-backup.yml archive.yml etl-check.yml; do
            gh workflow enable "$wf" -R "$GITHUB_REPOSITORY"
          done

      # Dead-man's switch, outside GitHub: a healthchecks.io check that emails the owner
      # when a day passes with no ping, whatever stopped the run. Skipped until the
      # HEALTHCHECKS_URL secret exists. Only on success, so a failing load also trips it.
      - name: Ping the dead-man's switch
        if: success() && env.HEALTHCHECKS_URL != ''
        working-directory: .
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL" > /dev/null
