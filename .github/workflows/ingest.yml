# Louisville Metro (ArcGIS) -> Supabase. Checked every two hours; loads only when the
# city's data has changed (pipeline/source_check.js, lib/ingestGate.js), at most twice a
# day on the schedule. A check reads nothing from the database: it asks the city's
# servers for row counts and sums, and compares them with the last load's fingerprint,
# which GitHub's Actions cache keeps (newest entry starting "ingest-state-"). A run by
# hand always loads. The city re-uploads its layers once a day, around 13:45 UTC.
name: Ingest ArcGIS -> Supabase
on:
  workflow_dispatch: {}
  schedule:
    # Every two hours at :23, off the busy top of the hour (GitHub started the old 08:30
    # run 7 to 10 hours late in November 2026). A check with nothing new takes a minute.
    - cron: "23 */2 * * *"
concurrency: ingest
jobs:
  run:
    runs-on: ubuntu-latest
    # actions: write lets the last step re-enable the schedules (see below).
    permissions:
      contents: write # the keep-alive commit below
      actions: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The newest saved state (the key never matches exactly; the prefix finds the newest).
      # The path is the same in every cache step: it is part of the cache's identity.
      - name: Restore the last load's fingerprint
        uses: actions/cache/restore@v4
        with:
          path: pipeline/.ingest-state/state.json
          key: ingest-state-${{ github.run_id }}
          restore-keys: ingest-state-

      - name: Has the city's data changed?
        id: gate
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node source_check.js

      # Saved before the load, so a load that fails still counts toward the daily cap, and
      # the next check tries again (the fingerprint in it is still the old one).
      - name: Count this load
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: pipeline/.ingest-state/state.json
          key: ingest-state-${{ github.run_id }}-${{ github.run_attempt }}-try

      # Every step from here to the fingerprint save runs only when the gate said so (and,
      # as always, only while the steps before it succeeded).
      - name: Install
        if: steps.gate.outputs.run == 'true'
        working-directory: .
        run: npm ci -w pipeline

      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: npm test

      - name: Recover failed runs
        if: steps.gate.outputs.run == 'true'
        run: node Recover.js

      # First: facilities.(facility_type, subtype) is a foreign key to facility_categories,
      # so a type/subtype pair the city adds must be in that table before backfill_types
      # writes it onto a facility.
      - name: Seed categories
        if: steps.gate.outputs.run == 'true'
        run: node seed_categories.js

      - name: Seed facilities
        if: steps.gate.outputs.run == 'true'
        run: node seed_facilities.js

      - name: Overlay geometry — pass 1
        if: steps.gate.outputs.run == 'true'
        run: node overlay_geometry.js

      - name: Seed inspections
        if: steps.gate.outputs.run == 'true'
        run: node seed_inspections.js

      - name: Overlay geometry — pass 2
        if: steps.gate.outputs.run == 'true'
        run: node overlay_geometry.js

      - name: Backfill facility types
        if: steps.gate.outputs.run == 'true'
        run: node backfill_types.js

      - name: Geocode missing geometry
        if: steps.gate.outputs.run == 'true'
        run: node geocode_missing.js

      - name: Seed violations
        if: steps.gate.outputs.run == 'true'
        run: node seed_violations.js

      # Tells the website the pins changed (data_loads, migration 20261203000000), so a
      # visitor's saved pins are read again on their next visit and not before.
      - name: Mark the load
        if: steps.gate.outputs.run == 'true'
        run: node mark_loaded.js jefferson

      - name: Remember this load's fingerprint
        if: steps.gate.outputs.run == 'true'
        run: mv .ingest-state/done.json .ingest-state/state.json

      - name: Save the fingerprint
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: pipeline/.ingest-state/state.json
          key: ingest-state-${{ github.run_id }}-${{ github.run_attempt }}-done

      # GitHub switches a public repo's scheduled workflows off after 60 days without
      # commits, silently; a week later Supabase's free plan would pause the project for
      # inactivity. Enabling a workflow is a no-op while it is on and counts as activity
      # on it (GitHub's own API, no third-party action). Runs even when a step above failed.
      # Every workflow with a schedule is found by its `cron:` line, so a new scheduled
      # workflow is kept on without editing this list (a hand-kept list once left the
      # portal ingest and the weekly digest out).
      - name: Keep the scheduled workflows enabled
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for path in $(grep -l "cron:" .github/workflows/*.yml); do
            wf=$(basename "$path")
            echo "enable $wf"
            gh workflow enable "$wf" -R "$GITHUB_REPOSITORY"
          done

      # Belt and braces: GitHub documents the 60-day rule in terms of commits, so if the
      # last commit on main is over 45 days old, push one empty commit to a `keepalive`
      # branch (main requires pull requests, so the bot can't push there). It changes no
      # files; a push anywhere in the repo is activity.
      - name: Keep-alive commit when main has been quiet for 45 days
        if: always()
        working-directory: .
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was $age day(s) ago."
          if [ "$age" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep the scheduled workflows alive (no changes)"
            git push --force origin HEAD:keepalive
          fi
