name: Weekly Database Backup

# Tiny on purpose. Every byte pg_dump reads counts against Supabase's 5 GB monthly egress,
# shared with everyone using the site, so this saves only what can't be rebuilt.
#
#   Sundays       a TINY dump: every table's definition, plus the rows of the small tables
#                 that can't be rebuilt (accounts, saved places, watch areas, feedback,
#                 Bullitt's and the portal's recorded history). About 0.5 MB read, so
#                 roughly 2-3 MB a month.
#                 Plus the rows ADDED in the last 10 days to inspections,
#                 inspection_violations and facilities (a few KB; 10 days so a skipped
#                 week loses nothing).
#   by hand only  a FULL dump: every table, every row (about 12 MB read). Nothing
#                 schedules one.
#
# Rows left out of the tiny dump (the tables' definitions are always dumped):
#   facilities, inspections,             reloaded from Louisville Metro's ArcGIS data by
#   inspection_violations                the ingest workflow; new rows saved weekly (below)
#   geocode_cache                        geocoder answers; only saves time on a re-geocode
#   bullitt_snapshots                    copies of the county's sheet, kept for reference
# The full dumps already in the backup repo are the base for those three big tables.
#
# Files in the backup repo:
#   backup-<date>.sql.gz                      full dumps from before this scheme: 2 kept
#   backup-<date>-full.sql.gz                 full dumps taken by hand: the last 3 are kept
#   backup-<date>-light.sql.gz                tiny dumps: the last 12 (about 3 months)
#   backup-<date>-new-<table>.csv.gz          all kept (each is a few KB)
#
# To restore: load the newest full dump, then the newest tiny dump's small tables, then
# every new-*.csv.gz dated after that full dump (the overlap repeats rows: load them into
# a scratch table and insert with ON CONFLICT DO NOTHING on the id). Or load the newest
# tiny dump and run the ingest workflow, which reloads facilities and inspections from
# the source (geocodes missing from the source are redone by the pipeline).
# Not caught: a correction to a row that was already saved. The next ingest has it.
# To take a full dump (before a risky migration, say): Actions > Weekly Database Backup >
# Run workflow, and tick "full". It costs about 12 MB of egress.

on:
  schedule:
    # Sundays, about 2am ET
    - cron: "17 7 * * 0"
  workflow_dispatch:
    inputs:
      full:
        description: "Full dump: downloads the whole database (about 12 MB of egress)"
        type: boolean
        default: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_REPO: ${{ secrets.BACKUP_REPO }} # e.g. "your-github-user/lfs-db-backups"
      BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    # Explicit bash turns on pipefail, so a pg_dump failure inside the pipe below
    # fails the step. Without it, a failed dump was gzipped into an empty backup
    # and the run still went green.
    defaults:
      run:
        shell: bash

    steps:
      # pg_dump refuses to export a server newer than itself, so install the
      # current client from the PostgreSQL project's own package repository.
      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Run pg_dump
        id: dump
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # Full only when asked for by hand; otherwise skip the rows of the big tables
          # (see the top of this file).
          SKIP=()
          KIND=full
          if [ "${{ inputs.full }}" != "true" ]; then
            KIND=light
            for t in facilities inspections inspection_violations geocode_cache bullitt_snapshots; do
              SKIP+=("--exclude-table-data=public.${t}")
            done
          fi
          FILENAME="backup-${DATE}-${KIND}.sql.gz"
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-acl --no-privileges \
            --exclude-table=spatial_ref_sys \
            "${SKIP[@]}" \
            | gzip -9 > "/tmp/${FILENAME}"
          echo "size=$(du -sh /tmp/${FILENAME} | cut -f1)" >> "$GITHUB_OUTPUT"

      # On tiny runs, the rows added since the last backup or two. All three tables stamp
      # created_at when a row is first inserted (facilities' updated_at moves on every
      # daily load, so it isn't used). A few hundred rows, not the whole table.
      - name: Export new facilities, inspections and violations
        if: steps.dump.outputs.kind == 'light'
        run: |
          DATE="${{ steps.dump.outputs.date }}"
          PSQL=/usr/lib/postgresql/17/bin/psql
          for pair in facilities:new-facilities inspections:new-inspections inspection_violations:new-violations; do
            TABLE="${pair%%:*}"
            NAME="${pair##*:}"
            "$PSQL" "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
              "\\copy (SELECT * FROM public.${TABLE} WHERE created_at >= now() - interval '10 days' ORDER BY 1) TO STDOUT WITH (FORMAT csv, HEADER)" \
              | gzip -9 > "/tmp/backup-${DATE}-${NAME}.csv.gz"
            echo "${NAME}: $(zcat "/tmp/backup-${DATE}-${NAME}.csv.gz" | wc -l) lines (with header)"
          done

      # Second guard: a tiny dump is small, so size alone can't tell a good one from a
      # failed one. Check that it holds the schema and the accounts table's rows.
      - name: Check the backup isn't empty
        run: |
          F="/tmp/${{ steps.dump.outputs.filename }}"
          echo "Backup size: $(stat -c %s "$F") bytes"
          for want in "CREATE TABLE public.facilities" "CREATE TABLE public.inspections" "COPY public.profiles"; do
            if ! zcat "$F" | grep -q "$want"; then
              echo "::error::The dump has no '${want}', so it almost certainly failed."
              exit 1
            fi
          done

      - name: Clone backup repo via deploy key
        env:
          SSH_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key" \
            git clone "git@github.com:${BACKUP_REPO}.git" /tmp/backup-repo

      - name: Copy backup file and prune old ones
        run: |
          cp /tmp/backup-${{ steps.dump.outputs.date }}-* /tmp/backup-repo/
          cd /tmp/backup-repo
          # Keep the 3 most recent hand-taken full dumps, the 2 most recent from before
          # this scheme (the base the weekly new rows build on), and 12 tiny dumps. The
          # new-rows files are never deleted: they are the only copy of rows added since
          # the last full dump.
          # Newest first by name: the date is in it, and a fresh clone gives every file
          # the same modified time.
          keep() { # keep <count> <glob>: delete all but the newest <count> matches
            { ls -1 $2 2>/dev/null || true; } | sort -r | tail -n +$(($1 + 1)) | xargs -r rm --
          }
          keep 3 "backup-*-full.sql.gz"
          keep 12 "backup-*-light.sql.gz"
          keep 2 "backup-????-??-??.sql.gz"
          echo "Remaining backups: $(ls backup-*.sql.gz | wc -l)"

      - name: Commit and push
        env:
          SSH_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          cd /tmp/backup-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "backup: ${{ steps.dump.outputs.date }} ${{ steps.dump.outputs.kind }} (${{ steps.dump.outputs.size }})"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key" git push

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: 587
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "[Louisville Food Safe] Weekly DB backup FAILED — ${{ steps.dump.outputs.date }}"
          to: ${{ env.NOTIFY_EMAIL }}
          from: "Louisville Food Safe Alerts <${{ env.SMTP_USERNAME }}>"
          body: |
            The weekly database backup workflow failed.

            Date: ${{ steps.dump.outputs.date }}
            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please check the workflow logs and investigate immediately.
