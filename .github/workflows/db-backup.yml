name: Nightly Database Backup

# A full dump on Sundays; on the other nights, everything except the rows of the big
# tables the pipeline can load again from its sources. Why: pg_dump downloads the
# database uncompressed (gzip runs here, afterwards), and that download counts against
# Supabase's 5 GB monthly egress. A full dump every night was the project's largest
# single download. What can't be rebuilt (accounts, saved places, watch areas, feedback,
# Bullitt's and the portal's recorded history) is still saved every night.
#
# Left out on weeknights (data only; the tables' definitions are always dumped):
#   inspections, inspection_violations   reloaded from Louisville Metro's ArcGIS data
#   geocode_cache                        geocoder answers; only saves time on a re-geocode
#   bullitt_snapshots                    copies of the county's sheet, kept for reference
# To take a full dump on any day: Actions > Nightly Database Backup > Run workflow, and
# tick "full".

on:
  schedule:
    # 2am ET = 7am UTC (EST) / 6am UTC (EDT) — close enough, pick one
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Full dump (every table's rows), whatever the day"
        type: boolean
        default: true

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_REPO: ${{ secrets.BACKUP_REPO }} # e.g. "your-github-user/lfs-db-backups"
      BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    # Explicit bash turns on pipefail, so a pg_dump failure inside the pipe below
    # fails the step. Without it, a failed dump was gzipped into an empty backup
    # and the run still went green.
    defaults:
      run:
        shell: bash

    steps:
      # pg_dump refuses to export a server newer than itself, so install the
      # current client from the PostgreSQL project's own package repository.
      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Run pg_dump
        id: dump
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # Full on Sundays (UTC) and when asked for; otherwise skip the rows of the
          # tables the pipeline can reload (see the top of this file).
          SKIP=()
          KIND=full
          if [ "$(date -u +%u)" != "7" ] && [ "${{ inputs.full }}" != "true" ]; then
            KIND=light
            for t in inspections inspection_violations geocode_cache bullitt_snapshots; do
              SKIP+=("--exclude-table-data=public.${t}")
            done
          fi
          FILENAME="backup-${DATE}-${KIND}.sql.gz"
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-acl --no-privileges \
            --exclude-table=spatial_ref_sys \
            "${SKIP[@]}" \
            | gzip -9 > "/tmp/${FILENAME}"
          echo "size=$(du -sh /tmp/${FILENAME} | cut -f1)" >> "$GITHUB_OUTPUT"

      # Second guard: a real dump is megabytes (a light one is smaller, but the facilities
      # alone put it well over this). Anything under 100 KB means something went wrong,
      # so fail (and send the failure email) instead of committing it.
      - name: Check the backup isn't empty
        run: |
          BYTES=$(stat -c %s "/tmp/${{ steps.dump.outputs.filename }}")
          echo "Backup size: ${BYTES} bytes"
          if [ "$BYTES" -lt 100000 ]; then
            echo "::error::Backup is only ${BYTES} bytes, so the dump almost certainly failed."
            exit 1
          fi

      - name: Clone backup repo via deploy key
        env:
          SSH_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key" \
            git clone "git@github.com:${BACKUP_REPO}.git" /tmp/backup-repo

      - name: Copy backup file and prune old ones
        run: |
          cp "/tmp/${{ steps.dump.outputs.filename }}" /tmp/backup-repo/
          cd /tmp/backup-repo
          # Keep the 30 most recent backups, and always the 5 most recent full ones (a
          # month of weeknight dumps would otherwise push the last full dump out).
          ls -1t backup-*.sql.gz | tail -n +31 > /tmp/old.txt || true
          ls -1t backup-*-full.sql.gz 2>/dev/null | head -n 5 > /tmp/keep.txt || true
          { grep -vxFf /tmp/keep.txt /tmp/old.txt || true; } | xargs -r rm --
          echo "Remaining backups: $(ls backup-*.sql.gz | wc -l)"

      - name: Commit and push
        env:
          SSH_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          cd /tmp/backup-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "backup: ${{ steps.dump.outputs.date }} ${{ steps.dump.outputs.kind }} (${{ steps.dump.outputs.size }})"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key" git push

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: 587
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "[Louisville Food Safe] Nightly DB backup FAILED — ${{ steps.dump.outputs.date }}"
          to: ${{ env.NOTIFY_EMAIL }}
          from: "Louisville Food Safe Alerts <${{ env.SMTP_USERNAME }}>"
          body: |
            The nightly database backup workflow failed.

            Date: ${{ steps.dump.outputs.date }}
            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please check the workflow logs and investigate immediately.
