name: Nightly Database Backup

# Old records don't change, so they aren't downloaded again every night.
#
#   1st of the month   a FULL dump: every table, every row.
#   every other night  a LIGHT dump (everything except the rows of the big tables below),
#                      plus only the NEW rows of inspections and inspection_violations
#                      (added in the last 3 days, so a skipped night loses nothing).
#
# Why: pg_dump downloads the database uncompressed (gzip runs here, afterwards), and that
# download counts against Supabase's 5 GB monthly egress. A full dump every night was the
# project's largest single download; this is about one full dump a month.
#
# What can't be rebuilt (accounts, saved places, watch areas, feedback, Bullitt's and the
# portal's recorded history) is in every night's light dump, in full.
#
# Rows left out of the light dump (the tables' definitions are always dumped):
#   inspections, inspection_violations   new rows are saved nightly (below); all of it can
#                                        also be reloaded from Louisville Metro's ArcGIS data
#   geocode_cache                        geocoder answers; only saves time on a re-geocode
#   bullitt_snapshots                    copies of the county's sheet, kept for reference
#
# Files in the backup repo:
#   backup-<date>-full.sql.gz                 the last 5 are kept (5 months)
#   backup-<date>-light.sql.gz                the last 45 are kept
#   backup-<date>-new-inspections.csv.gz      the last 45 are kept
#   backup-<date>-new-violations.csv.gz       the last 45 are kept
#
# To restore: load the newest full dump, then the newest light dump's small tables, then
# every new-*.csv.gz since that full dump (the 3-day overlap repeats rows: load them into
# a scratch table and insert with ON CONFLICT DO NOTHING on the id), or just run the
# ingest workflow, which reloads inspections from the source.
# Not caught between full dumps: a correction to an inspection that was already saved (the
# tables have no "updated" time). The next ingest from the source, or the next full dump,
# has it.
# To take a full dump on any day: Actions > Nightly Database Backup > Run workflow, and
# tick "full".

on:
  schedule:
    # 2am ET = 7am UTC (EST) / 6am UTC (EDT) — close enough, pick one
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Full dump (every table's rows), whatever the day"
        type: boolean
        default: true

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_REPO: ${{ secrets.BACKUP_REPO }} # e.g. "your-github-user/lfs-db-backups"
      BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    # Explicit bash turns on pipefail, so a pg_dump failure inside the pipe below
    # fails the step. Without it, a failed dump was gzipped into an empty backup
    # and the run still went green.
    defaults:
      run:
        shell: bash

    steps:
      # pg_dump refuses to export a server newer than itself, so install the
      # current client from the PostgreSQL project's own package repository.
      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Run pg_dump
        id: dump
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # Full on the 1st (UTC) and when asked for; otherwise skip the rows of the big
          # tables (see the top of this file).
          SKIP=()
          KIND=full
          if [ "$(date -u +%d)" != "01" ] && [ "${{ inputs.full }}" != "true" ]; then
            KIND=light
            for t in inspections inspection_violations geocode_cache bullitt_snapshots; do
              SKIP+=("--exclude-table-data=public.${t}")
            done
          fi
          FILENAME="backup-${DATE}-${KIND}.sql.gz"
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-acl --no-privileges \
            --exclude-table=spatial_ref_sys \
            "${SKIP[@]}" \
            | gzip -9 > "/tmp/${FILENAME}"
          echo "size=$(du -sh /tmp/${FILENAME} | cut -f1)" >> "$GITHUB_OUTPUT"

      # On light nights, the rows added since the last few backups. Both tables stamp
      # created_at when a row is first inserted. A few hundred rows, not the whole table.
      - name: Export new inspections and violations
        if: steps.dump.outputs.kind == 'light'
        run: |
          DATE="${{ steps.dump.outputs.date }}"
          PSQL=/usr/lib/postgresql/17/bin/psql
          for pair in inspections:new-inspections inspection_violations:new-violations; do
            TABLE="${pair%%:*}"
            NAME="${pair##*:}"
            "$PSQL" "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
              "\\copy (SELECT * FROM public.${TABLE} WHERE created_at >= now() - interval '3 days' ORDER BY 1) TO STDOUT WITH (FORMAT csv, HEADER)" \
              | gzip -9 > "/tmp/backup-${DATE}-${NAME}.csv.gz"
            echo "${NAME}: $(zcat "/tmp/backup-${DATE}-${NAME}.csv.gz" | wc -l) lines (with header)"
          done

      # Second guard: a real dump is megabytes (a light one is smaller, but the facilities
      # alone put it well over this). Anything under 100 KB means something went wrong,
      # so fail (and send the failure email) instead of committing it.
      - name: Check the backup isn't empty
        run: |
          BYTES=$(stat -c %s "/tmp/${{ steps.dump.outputs.filename }}")
          echo "Backup size: ${BYTES} bytes"
          if [ "$BYTES" -lt 100000 ]; then
            echo "::error::Backup is only ${BYTES} bytes, so the dump almost certainly failed."
            exit 1
          fi

      - name: Clone backup repo via deploy key
        env:
          SSH_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key" \
            git clone "git@github.com:${BACKUP_REPO}.git" /tmp/backup-repo

      - name: Copy backup file and prune old ones
        run: |
          cp /tmp/backup-${{ steps.dump.outputs.date }}-* /tmp/backup-repo/
          cd /tmp/backup-repo
          # Keep the 5 most recent full dumps and 45 of each nightly kind (more than a
          # month, so the nights since the newest full dump are always there). Older files
          # named backup-<date>.sql.gz, from before this scheme, age out too.
          # Newest first by name: the date is in it, and a fresh clone gives every file
          # the same modified time.
          keep() { # keep <count> <glob>: delete all but the newest <count> matches
            { ls -1 $2 2>/dev/null || true; } | sort -r | tail -n +$(($1 + 1)) | xargs -r rm --
          }
          keep 5 "backup-*-full.sql.gz"
          keep 45 "backup-*-light.sql.gz"
          keep 45 "backup-*-new-inspections.csv.gz"
          keep 45 "backup-*-new-violations.csv.gz"
          keep 30 "backup-????-??-??.sql.gz"
          echo "Remaining backups: $(ls backup-*.sql.gz | wc -l)"

      - name: Commit and push
        env:
          SSH_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          cd /tmp/backup-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "backup: ${{ steps.dump.outputs.date }} ${{ steps.dump.outputs.kind }} (${{ steps.dump.outputs.size }})"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key" git push

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: 587
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "[Louisville Food Safe] Nightly DB backup FAILED — ${{ steps.dump.outputs.date }}"
          to: ${{ env.NOTIFY_EMAIL }}
          from: "Louisville Food Safe Alerts <${{ env.SMTP_USERNAME }}>"
          body: |
            The nightly database backup workflow failed.

            Date: ${{ steps.dump.outputs.date }}
            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please check the workflow logs and investigate immediately.
