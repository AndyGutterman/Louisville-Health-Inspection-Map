# Bullitt County load, checked every two hours: the health department's public sheet ->
# Supabase, then geocoding. Writes only the bullitt_* tables (migration
# 20261110000000_bullitt_county.sql must have been run) and data_loads. See docs/BULLITT.md.
name: Ingest Bullitt County -> Supabase
on:
  workflow_dispatch:
    inputs:
      redo_geocoding:
        description: "Geocode every place again (not hand-placed pins), ignoring the cache"
        type: boolean
        default: false
  schedule:
    # The department updates the sheet about weekly, on no fixed hour (Friday 2026-11-20 it
    # changed just after that day's run, so it waited a day). A check of an unchanged sheet
    # downloads one CSV and reads a few small rows (the last snapshot's hash, the pin control
    # center's Bullitt fixes, places still to geocode; regions/bullitt/ingest.js), so every two hours,
    # at :41, off the busy top of the hour and away from Louisville's :23.
    - cron: "41 */2 * * *"
concurrency: bullitt-ingest
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the first run geocodes ~250 places at 1 a second
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        working-directory: .
        run: npm ci -w pipeline

      - name: Test
        run: npm test

      - name: Load and geocode
        env:
          REDO: ${{ inputs.redo_geocoding && '--redo-geocoding' || '' }}
        run: node regions/bullitt/ingest.js $REDO
