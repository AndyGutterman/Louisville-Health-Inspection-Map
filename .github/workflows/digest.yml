# Weekly digest email: this week's inspections to everyone subscribed (pipeline/digest/).
# The Tuesday schedule sends to every subscriber. A run by hand goes only to the owner
# unless "audience" says otherwise, so a test can't email everyone by accident.
name: Weekly digest email
on:
  workflow_dispatch:
    inputs:
      audience:
        description: "Who gets it. me = just the owner (a test). group = the emails below. everyone = every subscriber."
        type: choice
        options:
          - me
          - group
          - everyone
        default: me
      to:
        description: "For audience 'group': comma-separated emails. Only these get it."
        type: string
        default: ""
      dry_run:
        description: "Send nothing; attach the email as an artifact"
        type: boolean
        default: false
      days:
        description: "How many days the digest covers"
        type: number
        default: 7
  schedule:
    # Tuesday 11:00 UTC = 6 am EST / 7 am EDT, in the inbox for the morning coffee.
    - cron: "0 11 * * 2"
concurrency: digest
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      # The digest can send from its own account (DIGEST_SMTP_USERNAME + DIGEST_SMTP_PASSWORD,
      # both or neither); without them it uses the backup job's SMTP login. Gmail rewrites the
      # From line to the logged-in account, so the login decides the sender.
      SMTP_USERNAME: ${{ secrets.DIGEST_SMTP_PASSWORD && secrets.DIGEST_SMTP_USERNAME || secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.DIGEST_SMTP_USERNAME && secrets.DIGEST_SMTP_PASSWORD || secrets.SMTP_PASSWORD }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        working-directory: .
        run: npm ci -w pipeline
      - name: Test
        run: npm test

      # "me" goes to DIGEST_TEST_TO (a secret: the owner's own sign-in email, so the test
      # shows the owner's watch areas and the address stays out of the public logs), or to
      # the account the digest sends from when that secret isn't set. Test sends are
      # marked "[Test]" in the subject. The schedule has no inputs: every subscriber.
      - name: Build and send
        env:
          AUDIENCE: ${{ inputs.audience }}
          GROUP: ${{ inputs.to }}
          OWNER: ${{ secrets.DIGEST_TEST_TO }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
          DAYS: ${{ inputs.days || 7 }}
        run: |
          case "$AUDIENCE" in
            me) TO="${OWNER:-$SMTP_USERNAME}" ;;
            group) TO="$GROUP" ;;
            *) TO="" ;;
          esac
          if [ -n "$AUDIENCE" ] && [ "$AUDIENCE" != "everyone" ] && [ -z "$TO" ]; then
            echo "::error::No address for audience '$AUDIENCE'. Fill in 'to', or set the DIGEST_TEST_TO secret."
            exit 1
          fi
          node digest/send.js $DRY --days=$DAYS ${TO:+--to=$TO --test}

      - name: Attach the preview
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: pipeline/digest-preview.html
          retention-days: 7
