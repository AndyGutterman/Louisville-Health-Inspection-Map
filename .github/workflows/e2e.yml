name: E2E

# Playwright smoke tests (apps/web/e2e) on every pull request, desktop and phone.
# Tests the PR's Netlify deploy preview when Netlify builds one. Falls back to building
# the site here when the PR doesn't touch the website (Netlify skips the preview) or
# the preview isn't serving the PR's latest commit within 10 minutes. Screenshots and
# the HTML report are uploaded as artifacts and linked from one PR comment that is
# updated on every push.
on:
  pull_request:

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # the results comment

jobs:
  e2e:
    name: Playwright (desktop + phone)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--louisvillefoodsafe.netlify.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to diff the PR against its base branch

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright's Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Wait for the Netlify deploy preview
        id: target
        run: |
          # Netlify only builds a preview when the PR touches what the site is built
          # from: the same paths as the `ignore` rule in netlify.toml.
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- \
               apps/web packages package.json package-lock.json .nvmrc netlify.toml; then
            echo "This PR doesn't change the website, so Netlify won't build a preview."
            echo "mode=local" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The build stamps its commit into <meta name="build-commit"> (vite.config.js).
          for i in $(seq 1 40); do
            served=$(curl -fsSL "$PREVIEW_URL/" 2>/dev/null \
              | grep -o '<meta name="build-commit" content="[^"]*"' \
              | sed 's/.*content="//; s/"$//' || true)
            if [ "$served" = "$HEAD_SHA" ]; then
              echo "The preview is serving $HEAD_SHA."
              echo "mode=preview" >> "$GITHUB_OUTPUT"
              echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for the preview ($i/40). It is serving: ${served:-nothing yet}"
            sleep 15
          done
          echo "::warning::The Netlify preview didn't serve $HEAD_SHA within 10 minutes, so testing a local build instead."
          echo "mode=local" >> "$GITHUB_OUTPUT"

      - name: Run Playwright
        id: tests
        working-directory: apps/web
        env:
          BASE_URL: ${{ steps.target.outputs.url }} # empty = build and serve locally
        run: npx playwright test

      - name: Upload screenshots
        id: shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/web/e2e/screenshots/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Upload HTML report
        id: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Comment on the PR
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.tests.outcome }}
          MODE: ${{ steps.target.outputs.mode }}
          TARGET_URL: ${{ steps.target.outputs.url }}
          SHOTS_URL: ${{ steps.shots.outputs.artifact-url }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        with:
          script: |
            const { OUTCOME, MODE, TARGET_URL, SHOTS_URL, REPORT_URL } = process.env;
            const marker = "<!-- e2e-results -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const status =
              OUTCOME === "success" ? "✅ passed" :
              OUTCOME === "failure" ? "❌ failed" : `⚠️ ${OUTCOME || "did not run"}`;
            const target = MODE === "preview"
              ? `the [Netlify deploy preview](${TARGET_URL})`
              : "a build made inside the job (no Netlify preview for this commit)";
            const link = (url, text) => (url ? `[${text}](${url})` : "not uploaded");
            const body = [
              marker,
              `### End-to-end tests ${status}`,
              "",
              `Commit \`${sha}\`, desktop and phone, against ${target}.`,
              "",
              `- Screenshots: ${link(SHOTS_URL, "download (zip)")}`,
              `- HTML report: ${link(REPORT_URL, "download (zip)")}, then open \`index.html\``,
              `- [Run log](${runUrl})`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user.type === "Bot" && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
