name: Export database schema

# Run by hand from the Actions tab. Produces schema.sql (structure only, no rows)
# for the public schema: tables, views, functions, policies, grants and triggers.
on:
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      # pg_dump refuses to export a server newer than itself, so install the
      # current client from the PostgreSQL project's own package repository.
      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Dump schema
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema-only \
            --schema=public \
            --no-owner \
            --exclude-table=spatial_ref_sys \
            > schema.sql
          echo "Lines: $(wc -l < schema.sql)"

      - uses: actions/upload-artifact@v4
        with:
          name: schema
          path: schema.sql
          retention-days: 7
