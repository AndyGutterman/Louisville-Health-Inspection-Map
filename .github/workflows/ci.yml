name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InspectionWebsite
    env:
      # Dummy values so the build and tests never touch a real project.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: InspectionWebsite/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
