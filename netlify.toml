# Netlify builds from the repository root so npm installs the whole workspace
# (root package-lock.json), then builds the website package.
[build]
  command = "npm run build"
  publish = "apps/web/dist"
  # Skip the build when nothing the website depends on has changed since the
  # last deploy (exit code 0 means "skip"). Pipeline- or docs-only commits don't deploy.
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web packages package.json package-lock.json .nvmrc netlify.toml"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
